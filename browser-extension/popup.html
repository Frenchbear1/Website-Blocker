<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LumaGuard Companion</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="brand"><img id="brandIcon" src="icons/violet-32.png" alt=""><span>LumaGuard</span></div>
      <p class="eyebrow">BROWSER COMPANION</p>
      <h1 id="title">Checking connection…</h1>
      <p id="detail">Looking for the LumaGuard desktop app.</p>
      <div id="status" class="status waiting"><span></span><b>Checking</b></div>
      <button id="check">Check again</button>
      <p class="privacy">Only the focused domain and active seconds stay on this computer. Full URLs and page titles are never sent.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
