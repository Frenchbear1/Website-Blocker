<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily limit reached · LumaGuard</title>
    <link rel="stylesheet" href="blocked.css">
  </head>
  <body>
    <main class="card">
      <div class="shield">◇</div>
      <p class="eyebrow">LUMAGUARD</p>
      <h1>That’s enough for today.</h1>
      <p class="body"><strong id="domain">This website</strong> has reached the daily time allowance you chose.</p>
      <p class="note">Time resets automatically at local midnight on an active day. Keep LumaGuard running for website limits to work.</p>
      <div class="actions">
        <button id="check">Check again</button>
        <button id="back" class="secondary">Go back</button>
      </div>
      <p id="status" aria-live="polite"></p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
